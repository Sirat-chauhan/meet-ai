name: Keep Alive Ping

on:
  schedule:
    # Runs at 00:00 every 3rd day
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space Health Endpoint
        run: |
          # Replace the URL below with your actual Hugging Face Space URL
          # E.g., https://yourusername-yourspace.hf.space/health
          URL="https://YOUR_USERNAME-YOUR_SPACE_NAME.hf.space/health"
          
          echo "Pinging $URL..."
          curl -f "$URL"
